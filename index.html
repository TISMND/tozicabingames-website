<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tozi Cabin Games</title>
<meta name="description" content="Tozi Cabin Games is an independent studio making games for phones. Three in development: Syntherion, The Third Party and Quiet World.">
<link rel="canonical" href="https://tozicabingames.com/">

<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#0b0b0d">
<link rel="preload" href="fonts/bebas-neue-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles.css?v=2">
<script src="loops.js?v=2" defer></script>

<!-- og:site_name is deliberately omitted: it renders directly above og:title on
     Discord and Slack, and with both set to the studio name the card stacked the
     same words twice. The name lives in og:title instead, where every platform
     shows it. -->
<meta property="og:title" content="Tozi Cabin Games — Syntherion, The Third Party, Quiet World">
<meta property="og:description" content="An independent studio making games for phones. Three in development: Syntherion, The Third Party and Quiet World.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://tozicabingames.com/">
<meta property="og:locale" content="en_US">

<meta property="og:image" content="https://tozicabingames.com/og-image.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="The Tozi Cabin Games logo over a moonlit mountain range, above three phones showing Syntherion, The Third Party and Quiet World.">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://tozicabingames.com/og-image.jpg">
</head>
<body>

  <header class="band">
    <div class="lockup"><img src="img/tozi-mark.webp" alt="" width="84" height="84"><h1>Tozi<span>Cabin Games</span></h1></div>
  </header>

  <main class="panels">

    <a class="panel panel--syntherion panel--has-art" href="/syntherion/">
      <span class="panel__art" aria-hidden="true"></span>
      <span class="phone" aria-hidden="true"><span class="phone__screen">
        <video class="panel__loop" muted loop playsinline preload="none"
          src="https://pub-e52e55062eab45daaa777a6bec1f03ca.r2.dev/syntherion/home-loop-v1.mp4"></video>
      </span></span>
      <span class="panel__label">
        <img class="panel__title panel__title--art panel__title--syntherion" src="img/syntherion-title.webp" alt="Syntherion">
        <span class="panel__note">In development</span>
      </span>
    </a>

    <a class="panel panel--third-party panel--has-art" href="/thirdparty/">
      <span class="panel__art" aria-hidden="true"></span>
      <span class="phone" aria-hidden="true"><span class="phone__screen">
        <video class="panel__loop" muted loop playsinline preload="none"
          src="https://pub-e52e55062eab45daaa777a6bec1f03ca.r2.dev/thirdparty/home-loop-v1.mp4"></video>
      </span></span>
      <span class="panel__label">
        <img class="panel__title panel__title--art panel__title--third-party" src="img/the-third-party-title.webp" alt="The Third Party">
        <span class="panel__note">In development</span>
      </span>
    </a>

    <a class="panel panel--quiet-world panel--has-art" href="/quietworld/">
      <span class="panel__art" aria-hidden="true"></span>
      <span class="phone" aria-hidden="true"><span class="phone__screen">
        <video class="panel__loop" muted loop playsinline preload="none"
          src="https://pub-e52e55062eab45daaa777a6bec1f03ca.r2.dev/quietworld/home-loop-v1.mp4"></video>
      </span></span>
      <span class="panel__label">
        <span class="panel__title panel__title--quiet-world">Quiet World</span>
        <span class="panel__note">In development</span>
      </span>
    </a>

  </main>

</body>
</html>
