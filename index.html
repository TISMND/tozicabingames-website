<meta property="og:title" content="Tozi Cabin Games — high-concept sci-fi games">
<meta property="og:description" content="An independent studio making high-concept sci-fi games. Syntherion and The Third Party, both in development.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://tozicabingames.com/">

<body>

  <header class="wordmark">

      </span>
    </a>

    <div class="panel panel--third-party panel--has-art">

      </span>
