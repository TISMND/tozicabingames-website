<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tozi Cabin Games</title>
<meta name="description" content="Tozi Cabin Games — makers of Syntherion and Assimilarium.">
<link rel="stylesheet" href="styles.css">

<meta property="og:title" content="Tozi Cabin Games">
<meta property="og:description" content="Makers of Syntherion and Assimilarium.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://tozicabingames.com/">
</head>
<body>

  <header class="wordmark">
    <h1>Tozi Cabin Games</h1>
  </header>

  <main class="panels">

    <a class="panel panel--syntherion panel--has-art" href="https://syntheriongame.com">
      <span class="panel__art" aria-hidden="true"></span>
      <span class="panel__label">
        <span class="panel__title">Syntherion</span>
        <span class="panel__note">Visit the site</span>
      </span>
    </a>

    <div class="panel panel--assimilarium">
      <span class="panel__art" aria-hidden="true"></span>
      <span class="panel__label">
        <span class="panel__title">Assimilarium</span>
        <span class="panel__note">Coming soon</span>
      </span>
    </div>

  </main>

  <nav class="dots" aria-hidden="true">
    <span class="dot"></span>
    <span class="dot"></span>
  </nav>

  <script>
    // Progressive enhancement: only once this runs do the mobile panels rest dim
    // and light up one at a time. Without it every label just stays visible.
    document.documentElement.classList.add('js');

    (function () {
      var panels = Array.prototype.slice.call(document.querySelectorAll('.panel'));
      var dots = Array.prototype.slice.call(document.querySelectorAll('.dot'));
      var scroller = document.querySelector('.panels');
      var queued = false;

      function focusNearest() {
        queued = false;
        var middle = window.innerWidth / 2;
        var winner = 0;
        var best = Infinity;

        panels.forEach(function (panel, i) {
          var box = panel.getBoundingClientRect();
          var distance = Math.abs(box.left + box.width / 2 - middle);
          if (distance < best) {
            best = distance;
            winner = i;
          }
        });

        panels.forEach(function (panel, i) {
          panel.classList.toggle('is-focused', i === winner);
        });
        dots.forEach(function (dot, i) {
          dot.classList.toggle('is-active', i === winner);
        });
      }

      function schedule() {
        if (!queued) {
          queued = true;
          requestAnimationFrame(focusNearest);
        }
      }

      scroller.addEventListener('scroll', schedule, { passive: true });
      window.addEventListener('resize', schedule);
      focusNearest();
    })();
  </script>

</body>
</html>
